<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .span-1{
            display: block;
            background-color: yellow;
            height: 50px;
        }
        .span-2{
            background-color: red;
            display: inline-block;
            height: 50px;
            width: 100px;
        }
        .div-1 {
            background-color: yellow;
            display: inline;
            height: 50px;
        }
        .div-2 {
            background-color: red;
            display: none;
        }
    </style>
</head>
<body>
    <span class="span-1">Span 1</span>
    <span class="span-2">Span 2</span>

    <div class="div-1">Block Eleemnt 1</div>
    <div class="div-2">Block Eleemnt 2</div>
</body>
</html>
