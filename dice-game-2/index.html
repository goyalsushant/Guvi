<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <h2>Dice Game</h2>
        <p>First to reach 5 points wins the match!</p>

        <div class="scoreboard">
            <div class="score">
                <h2>Player 1</h2>
                <p id="score1">0</p>
            </div>
            <div class="score">
                <h2>Player 2</h2>
                <p id="score2">0</p>
            </div>
        </div>

        <div class="dice-container">
            <div class="dice">
                <h2>Player 1</h2>
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Dice-1-b.svg" alt="" id="dice1">
            </div>
            <div class="dice">
                <h2>Player 2</h2>
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Dice-1-b.svg" alt="" id="dice2">
            </div>
        </div>

        <div class="interact">
            <button id="rollButton">Roll Dice</button>
            <button id="resetButton">Reset</button>
        </div>

        <h2 id="result"></h2>

    </div>

    <script src="script.js"></script>
</body>

</html>
