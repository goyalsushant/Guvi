<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tailwind Concepts Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Volkhov:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">

</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="bg-white p-6 w-80 rounded-lg">
    <img src="https://placehold.co/600x400" alt="Placeholder Image" class="w-full h-40 rounded-md mb-4 object-cover">
    <h1 class="font-bold mb-2 text-gray-800 text-lg font-['Volkhov']">Card Title</h1>
    <p class="text-gray-600 mb-4 text-sm">This is a description inside the card. It talks about the content and purpose.
    </p>
    <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">Click Me</button>
  </div>
</body>

</html>
