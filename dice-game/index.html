<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Dice Game</h1>
        <p>Click Roll Dice to see who wins</p>
        <div class="dice-container">
            <div class="dice">
                <h2>Player 1</h2>
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Dice-1-b.svg" alt="" id="dice1">
            </div>
            <div class="dice">
                <h2>Player 2</h2>
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Dice-1-b.svg" alt="" id="dice2">
            </div>
        </div>

        <button id="rollButton">Roll Dice</button>
        <h2 id="result"></h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
